<!DOCTYPE html>
<html>
<head>
    <style>
        @font-face {
            font-family: 'printf';
            src: url('resources/PRINTF Regular.ttf') format('truetype');
        }
        
        html {
            overflow: hidden;
            cursor: none;
        }
        
        * {
            cursor: none !important;
        }
        
        body {
            background-color: rgb(0, 0, 0);
            margin: 0;
            padding: 0;
            height: 100vh;
            position: relative;
            overflow-x: auto;
            overflow-y: hidden;
            overscroll-behavior: none;
            overscroll-behavior-x: none;
            overscroll-behavior-y: none;
            cursor: none; /* Use the custom cursor instead of the native one */
        }
        
        /* Prevent vertical scrolling on mobile */
        @media (max-width: 768px) {
            html {
                overflow: hidden;
                height: 100%;
                position: fixed;
                width: 100%;
            }
            
            body {
                overflow-y: hidden !important;
                overflow-x: auto;
                height: 100vh;
                height: -webkit-fill-available;
                position: fixed;
                width: 100%;
                touch-action: pan-x;
            }
            
            /* Prevent pull-to-refresh and overscroll on mobile */
            body {
                overscroll-behavior-y: none !important;
                -webkit-overflow-scrolling: touch;
            }
        }
        
        /* Loading screen - ground starts expanded and shrinks down */
        .ground.loading {
            height: 100vh !important;
            z-index: 1999;
        }
        
        /* Ensure ground returns to normal height when loading is removed */
        .ground:not(.loading):not(.expanding) {
            height: 10vh !important;
        }
        
        /* Loading indicator */
        .loading-indicator {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2001;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 1;
            transition: opacity 0.5s ease;
            pointer-events: none;
        }
        
        .loading-indicator.hidden {
            opacity: 0;
            pointer-events: none;
        }
        
        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top: 3px solid rgb(255, 255, 255);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .loading-text {
            margin-top: 20px;
            color: rgb(255, 255, 255);
            font-family: 'Avenir', 'Avenir Next', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 1px;
        }
        
        /* Custom cursor: outer follows position, inner handles scale transition */
        .custom-cursor {
            position: fixed;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 2000;
            transform: translate3d(-100px, -100px, 0);
        }
        .custom-cursor .custom-cursor-shape {
            position: absolute;
            top: 50%;
            left: 0;
            width: 12px;
            height: 12px;
            margin: 0;
            background: rgb(255, 255, 255);
            border-radius: 0;
            transform: translateY(-50%);
            box-sizing: border-box;
            overflow: hidden;
            transition: width 320ms ease, height 320ms ease, padding 320ms ease, transform 200ms cubic-bezier(0.4, 0, 0.2, 1), background 320ms ease, border-radius 320ms ease;
        }
        .custom-cursor .custom-cursor-text {
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            font-family: 'Avenir', 'Avenir Next', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 12px;
            font-weight: bold;
            color: rgb(0, 0, 0);
            transition: opacity 320ms ease;
            line-height: 1;
        }
        .custom-cursor.is-hovering .custom-cursor-shape {
            width: max-content;
            height: 24px;
            padding: 4px 8px;
            transform: translateY(-50%);
            background: rgb(255, 255, 255);
            display: flex;
            align-items: center;
            justify-content: flex-start;
            overflow: hidden;
        }
        .custom-cursor.is-hovering .custom-cursor-text {
            opacity: 1;
        }
        .custom-cursor.is-clicking .custom-cursor-shape {
            transform: translateY(-50%) scale(0.5);
            transition: transform 200ms cubic-bezier(0.4, 0, 0.2, 1), width 320ms ease, height 320ms ease, padding 320ms ease, background 320ms ease, border-radius 320ms ease;
        }

        .background-image {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
            pointer-events: none;
            transform: scaleX(-1);
        }
        
        .background-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
            pointer-events: none;
            transform: scaleX(-1);
        }
        
        /* Fallback background for browsers that don't support the video */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgb(0, 0, 0);
            z-index: -1;
        }
        
        .scene-container {
            position: relative;
            height: 100%;
            width: calc(1650px + 48vh + 100px); /* Content width + start padding + end padding */
        }

        .ground {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 10vh;
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
            background-color: black;
            z-index: 1999;
            transition: height 1.5s cubic-bezier(0.4, 0, 0.2, 1);
            will-change: height;
        }

        .ground.expanding {
            height: 100vh;
            z-index: 1999;
            transition: height 1s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .building-container {
            position: absolute;
            bottom: 10vh;  /* Keep this to align with ground */
            height: calc(100vh - 10vh);  /* Fill from ground to top */
            width: 48vh;
            transform-origin: bottom center;
            background-color: rgba(255, 0, 0, 0);
        }

        .house {
            position: absolute;
            bottom: 0;
            height: 100%;  /* Fill the container height */
            width: auto;   /* Width will adjust to maintain aspect ratio */
            object-fit: contain;  /* Maintain aspect ratio while filling height */
            user-select: none;
            z-index: 100;
            pointer-events: auto; /* Enable clicks on house image */
            cursor: none;
        }

        .house-click-blocker {
            position: absolute;
            top: 0;
            left: 0;
            width: 0;
            height: 0;
            background-color: transparent;
            z-index: 103;
            pointer-events: auto; /* Block clicks on top portion */
            cursor: none;
        }

        .house-line {
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            height: 2px;
            background-color: red;
            transform: translateY(-50%);
            z-index: 101;
            pointer-events: none;
            opacity: 0; /* Hide the line but keep it for positioning calculations */
        }

        /* Individual line height adjustments */
        #house-line-anni {
            top: 35%; /* Adjust this value to change the line position (0% = top, 100% = bottom) */
        }

        #house-line-lotta {
            top: 12%;
        }

        #house-line-club {
            top: 43%;
        }

        #house-line-myart {
            top: 25%;
        }

        #lotta-building { 
            left: 1150px; 
            z-index: 10;
            transform-origin: bottom center;
            transform: scale(1);
        }
        #myart-building { 
            left: 1600px; 
            z-index: 3;
            transform-origin: bottom center;
            transform: scale(1);
        }
        #anni-building { 
            left: 400px; 
            z-index: 2;
            transform-origin: bottom center;
            transform: scale(1);
        }
        #club-building { 
            left: 800px; 
            z-index: 1;
            transform-origin: bottom center;
            transform: scale(1);

        .car {
            position: fixed;
            bottom: 9.9vh;

            object-fit: contain;
            user-select: none;
            z-index: 4;

        .skyline {
            position: fixed;
            bottom: 10vh;
            left: 0;
            width: calc(1650px + 48vh + 100px);
            min-width: 100vw;
            height: calc(100vh - 10vh);
            object-fit: cover;
            z-index: 0;
            pointer-events: none;
        }

        .background {
            position: fixed;

        }

        .title {
            position: fixed;
            top: 20px;
            left: 20px;
            height: auto;
            width: calc(100% - 40px);
            z-index: 1; /* ensures it stays on top */
            pointer-events: none; /* prevents it from interfering with scrolling */

        .click {
            position: absolute;
            height: 10%;  /* Adjust size as needed */
            width: auto;
            bottom: 45%;  /* Adjust position as needed */
            left: -25%;    /* Adjust position as needed */
            object-fit: contain;

        .birds {
            position: absolute;

        }

        .palmtree {
            position: absolute;
            height: 50%;  /* Adjust size as needed */

            left: 240%;    /* Adjust position as needed */
            object-fit: contain;

        }

        .sixten {
            position: absolute;
            height: 10%;  /* Adjust size as needed */
            width: auto;
            bottom: 64.5%;  /* Adjust position as needed */

        }

        .butterfly {
            position: absolute;
            height: 12%;  /* Adjust size as needed */

            object-fit: contain;
            user-select: none;
            z-index: 1;
        }

    </style>
    <script>
        
        // Function to update car and building positions based on horizontal scroll
        function updateScrollEffects() {
            const scrolled = document.body.scrollLeft;
            const bodyScrollWidth = document.body.scrollWidth;
            const maxScroll = Math.max(bodyScrollWidth - window.innerWidth, 0);
            
            // Calculate car position relative to scroll progress
            const car = document.getElementById('car');
            if (car && maxScroll > 0) {
                const clampedScroll = Math.min(Math.max(scrolled, 0), maxScroll);
                const progress = clampedScroll / maxScroll;
                const maxCarTravel = window.innerWidth - car.offsetWidth - 30;
                const carPosition = progress * maxCarTravel;
                car.style.transform = `translateX(${carPosition}px)`;
            } else if (car) {
                car.style.transform = 'translateX(0px)';
            }

            // Move buildings at different speeds
            const lottaBuilding = document.getElementById('lotta-building');
            const myartBuilding = document.getElementById('myart-building');
            const anniBuilding = document.getElementById('anni-building');
            const clubBuilding = document.getElementById('club-building');
            
            if (lottaBuilding) lottaBuilding.style.transform = `translateX(${scrolled * -0.3}px)`;
            if (myartBuilding) myartBuilding.style.transform = `translateX(${scrolled * 0}px)`;
            if (anniBuilding) anniBuilding.style.transform = `translateX(${scrolled * 0.1}px)`;
            if (clubBuilding) clubBuilding.style.transform = `translateX(${scrolled * 0.2}px)`;
            
            // Parallax effect for skyline (moves slower than scroll for depth effect)
            const skyline = document.querySelector('.skyline');
            if (skyline) {
                skyline.style.transform = `translateX(${scrolled * -0.1}px)`;
            }
            
        }
        
        // Smooth scrolling implementation
        let targetScrollLeft = 0;
        let currentScrollLeft = 0;
        let isScrolling = false;
        
        function smoothScroll() {
            if (!isScrolling) return;
            
            // Easing function for smooth deceleration
            const diff = targetScrollLeft - currentScrollLeft;
            const speed = 0.15; // Adjust this for scroll speed (0.1 = slower, 0.3 = faster)
            
            if (Math.abs(diff) < 0.5) {
                // Close enough, snap to target
                currentScrollLeft = targetScrollLeft;
                document.body.scrollLeft = currentScrollLeft;
                updateScrollEffects();
                isScrolling = false;
            } else {
                // Smooth interpolation
                currentScrollLeft += diff * speed;
                document.body.scrollLeft = currentScrollLeft;
                updateScrollEffects();
                requestAnimationFrame(smoothScroll);
            }
        }
        
        // Initialize scroll position after DOM is ready
        function initializeSmoothScroll() {
            currentScrollLeft = document.body.scrollLeft || 0;
            targetScrollLeft = currentScrollLeft;
        }
        
        // Wheel event for horizontal scroll
        window.addEventListener('wheel', function(e) {
            e.preventDefault();
            
            // Calculate scroll delta
            const scrollDelta = e.deltaY * 0.15; // Slower scrolling (15% of normal speed)
            const bodyScrollWidth = document.body.scrollWidth;
            const maxScroll = Math.max(bodyScrollWidth - window.innerWidth, 0);
            
            // Update target scroll position
            targetScrollLeft = Math.min(Math.max(targetScrollLeft + scrollDelta, 0), maxScroll);
            
            // Start smooth scrolling animation if not already running
            if (!isScrolling) {
                isScrolling = true;
                requestAnimationFrame(smoothScroll);
            }
        }, { passive: false });
        
        // Initialize on DOM ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initializeSmoothScroll);
        } else {
            initializeSmoothScroll();
        }
        
        // Prevent vertical scrolling on mobile - only allow horizontal
        let touchStartX = 0;
        let touchStartY = 0;
        
        function isMobile() {
            return window.innerWidth <= 768;
        }
        
        document.addEventListener('touchstart', function(e) {
            if (isMobile()) {
                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
            }
        }, { passive: true });
        
        document.addEventListener('touchmove', function(e) {
            if (isMobile()) {
                const touchX = e.touches[0].clientX;
                const touchY = e.touches[0].clientY;
                const deltaX = Math.abs(touchX - touchStartX);
                const deltaY = Math.abs(touchY - touchStartY);
                
                // If vertical movement is greater than horizontal, prevent it
                if (deltaY > deltaX) {
                    e.preventDefault();
                }
            }
        }, { passive: false });

        // Function to handle navigation with ground expansion
        function navigateWithTransition(url) {
            // Save current horizontal scroll position before navigating
            sessionStorage.setItem('cityScrollPosition', document.body.scrollLeft.toString());
            
            const ground = document.querySelector('.ground');
            ground.classList.add('expanding');
            
            // Wait for animation to complete before navigating
            ground.addEventListener('transitionend', function onTransitionEnd() {
                ground.removeEventListener('transitionend', onTransitionEnd);
                window.location.href = url;
            }, { once: true });
        }

        // Position red lines to match house widths and set up click blockers
        function positionHouseLines() {
            requestAnimationFrame(function() {
                const houses = document.querySelectorAll('.house');
                houses.forEach(function(house) {
                    const line = house.nextElementSibling;
                    if (line && line.classList.contains('house-line')) {
                        const container = house.parentElement;
                        const containerHeight = container.offsetHeight;
                        const containerWidth = container.offsetWidth;
                        
                        // Set line width to match house width (or container width as fallback)
                        const houseWidth = house.offsetWidth || containerWidth;
                        if (houseWidth > 0 && containerHeight > 0) {
                            line.style.width = houseWidth + 'px';
                            line.style.left = '0px';
                            
                            // Position click blocker to cover top portion (above the line)
                            const blocker = line.nextElementSibling;
                            if (blocker && blocker.classList.contains('house-click-blocker')) {
                                // Get the line's actual position relative to container
                                const lineRect = line.getBoundingClientRect();
                                const containerRect = container.getBoundingClientRect();
                                const lineTopPx = lineRect.top - containerRect.top + (lineRect.height / 2); // Use center of line
                                
                                // Position from top to line center (blocks clicks above the line)
                                blocker.style.top = '0px';
                                blocker.style.bottom = '';
                                blocker.style.height = lineTopPx + 'px';
                                blocker.style.width = houseWidth + 'px';
                                blocker.style.left = '0px';
                                blocker.style.display = 'block'; // Ensure it's visible
                            }
                        }
                    }
                });
            });
        }

        // Ground animation state - prevent multiple triggers
        let groundAnimationTriggered = false;
        
        // Function to animate ground down - ensures it only happens once
        // Defined in global scope so it's accessible everywhere
        function animateGroundDown() {
            const ground = document.querySelector('.ground');
            if (!ground) return;
            
            // Use the guard to prevent multiple triggers
            if (groundAnimationTriggered) return;
            if (ground.classList.contains('expanding')) return;
            groundAnimationTriggered = true;
            
            // Ensure it's in loading state first
            if (!ground.classList.contains('loading')) {
                ground.classList.add('loading');
                ground.offsetHeight; // Force reflow
            }
            
            // Then animate down
            requestAnimationFrame(function() {
                requestAnimationFrame(function() {
                    ground.classList.remove('loading');
                });
            });
        }
        
        // Function to initialize ground animation
        function initializeGroundAnimation() {
            const ground = document.querySelector('.ground');
            const loadingIndicator = document.querySelector('.loading-indicator');
            
            // Show loading indicator
            if (loadingIndicator) {
                loadingIndicator.classList.remove('hidden');
            }
            
            if (ground) {
                // Reset the ground to loading state
                ground.classList.remove('expanding');
                ground.classList.add('loading');
                // Force a reflow to ensure the browser applies the 100vh state
                ground.offsetHeight;
            }
            
            // Reset the trigger flag so animation can run again
            groundAnimationTriggered = false;
            
            // Use the animation function
            setTimeout(animateGroundDown, 600);
        }
        
        // Loading screen functionality - ground animation (reversed)
        // Ensure ground starts in loading state immediately
        document.addEventListener('DOMContentLoaded', function() {
            initializeGroundAnimation();
        });
        
        // Handle page restoration from back/forward cache (bfcache)
        // This ensures the ground animation plays when using browser back button
        window.addEventListener('pageshow', function(event) {
            // event.persisted is true when page is restored from bfcache
            if (event.persisted) {
                // Reset and re-trigger the ground animation
                initializeGroundAnimation();
            }
        });
        
        window.addEventListener('load', function() {
            const ground = document.querySelector('.ground');
            const body = document.body;
            const images = document.querySelectorAll('img');
            const video = document.querySelector('.background-video');
            
            let imagesLoaded = 0;
            let videoLoaded = false;
            let isLoadingComplete = false;
            const totalImages = images.length;
            const totalAssets = totalImages + (video ? 1 : 0);
            
            // Check if all images are loaded
            function checkImageLoad() {
                imagesLoaded++;
                if (imagesLoaded === totalImages && videoLoaded) {
                    hideLoadingScreen();
                }
            }
            
            // Check if video is loaded
            function checkVideoLoad() {
                if (video.readyState >= 3) { // HAVE_FUTURE_DATA or higher
                    videoLoaded = true;
                    if (imagesLoaded === totalImages) {
                        hideLoadingScreen();
                    }
                } else {
                    video.addEventListener('canplaythrough', function() {
                        videoLoaded = true;
                        if (imagesLoaded === totalImages) {
                            hideLoadingScreen();
                        }
                    }, { once: true });
                }
            }
            
            function hideLoadingScreen() {
                isLoadingComplete = true;
                
                // Hide loading indicator
                const loadingIndicator = document.querySelector('.loading-indicator');
                if (loadingIndicator) {
                    loadingIndicator.classList.add('hidden');
                }
                
                // Remove loading class from ground to trigger reverse animation
                const ground = document.querySelector('.ground');
                if (ground) {
                    ground.classList.remove('loading');
                }
                
                body.classList.remove('loading');
                body.classList.add('loaded');
                
                // Update skyline width after content loads
                setTimeout(function() {
                    const skyline = document.querySelector('.skyline');
                    const sceneContainer = document.querySelector('.scene-container');
                    if (skyline && sceneContainer) {
                        const scrollWidth = Math.max(document.body.scrollWidth, sceneContainer.offsetWidth);
                        skyline.style.width = Math.max(scrollWidth, window.innerWidth) + 'px';
                    }
                }, 100);
                
                // Restore scroll position if coming back from a project page
                const savedScrollPosition = sessionStorage.getItem('cityScrollPosition');
                if (savedScrollPosition !== null) {
                    // Wait a bit for the page to fully render before restoring scroll
                    setTimeout(() => {
                        // Restore horizontal scroll
                        const scrollPos = parseInt(savedScrollPosition, 10);
                        document.body.scrollLeft = scrollPos;
                        
                        // Sync smooth scroll variables
                        currentScrollLeft = scrollPos;
                        targetScrollLeft = scrollPos;
                        
                        // Update building positions and car based on scroll
                        const scrolled = document.body.scrollLeft;
                        const lottaBuilding = document.getElementById('lotta-building');
                        const myartBuilding = document.getElementById('myart-building');
                        const anniBuilding = document.getElementById('anni-building');
                        const clubBuilding = document.getElementById('club-building');
                        const car = document.getElementById('car');
                        
                        if (lottaBuilding) lottaBuilding.style.transform = `translateX(${scrolled * -0.3}px)`;
                        if (myartBuilding) myartBuilding.style.transform = `translateX(${scrolled * 0}px)`;
                        if (anniBuilding) anniBuilding.style.transform = `translateX(${scrolled * 0.1}px)`;
                        if (clubBuilding) clubBuilding.style.transform = `translateX(${scrolled * 0.2}px)`;
                        
                        // Update skyline parallax
                        const skyline = document.querySelector('.skyline');
                        if (skyline) {
                            skyline.style.transform = `translateX(${scrolled * -0.1}px)`;
                        }
                        
                        // Update car position
                        if (car) {
                            const bodyScrollWidth = document.body.scrollWidth;
                            const maxScroll = Math.max(bodyScrollWidth - window.innerWidth, 0);
                            if (maxScroll > 0) {
                                const clampedScroll = Math.min(Math.max(scrolled, 0), maxScroll);
                                const progress = clampedScroll / maxScroll;
                                const maxCarTravel = window.innerWidth - car.offsetWidth - 30;
                                const carPosition = progress * maxCarTravel;
                                car.style.transform = `translateX(${carPosition}px)`;
                            }
                        }
                        
                        // Position house lines after layout is restored
                        positionHouseLines();
                        
                        // Clear the saved position after restoring
                        sessionStorage.removeItem('cityScrollPosition');
                    }, 100);
                }
            }
            
            // Handle image loading
            images.forEach(function(img) {
                if (img.complete) {
                    checkImageLoad();
                } else {
                    img.addEventListener('load', checkImageLoad, { once: true });
                    img.addEventListener('error', checkImageLoad, { once: true }); // Count errors too to not block
                }
            });
            
            // Handle video loading
            if (video) {
                checkVideoLoad();
            } else {
                videoLoaded = true;
                if (imagesLoaded === totalImages) {
                    hideLoadingScreen();
                }
            }
            
            // Timeout fallback
            setTimeout(function() {
                if (!body.classList.contains('loaded')) {
                    hideLoadingScreen();
                }
            }, 5000);
        });

        // Setup house click handlers after images are loaded
        window.addEventListener('load', function() {
            // Click handlers for house images (only bottom portions will be clickable due to blockers)
            const lottaHouse = document.querySelector('#lotta-building .house');
            const myartHouse = document.querySelector('#myart-building .house');
            const anniHouse = document.querySelector('#anni-building .house');
            const clubHouse = document.querySelector('#club-building .house');
            
            if (lottaHouse) {
                lottaHouse.addEventListener('click', function(e) {
                    e.stopPropagation();
                    e.preventDefault();
                    navigateWithTransition('project3.html');
                });
            }
            
            if (myartHouse) {
                myartHouse.addEventListener('click', function(e) {
                    e.stopPropagation();
                    e.preventDefault();
                    navigateWithTransition('project2.html');
                });
            }
            
            if (anniHouse) {
                anniHouse.addEventListener('click', function(e) {
                    e.stopPropagation();
                    e.preventDefault();
                    navigateWithTransition('project1.html');
                });
            }
            
            if (clubHouse) {
                clubHouse.addEventListener('click', function(e) {
                    e.stopPropagation();
                    e.preventDefault();
                    navigateWithTransition('project4.html');
                });
            }

            // Position lines after images are loaded - with retry
            positionHouseLines();
            // Retry after a short delay to ensure dimensions are calculated
            setTimeout(positionHouseLines, 100);
            setTimeout(positionHouseLines, 500);
            // Also position on window resize
            window.addEventListener('resize', positionHouseLines);
        });

        // Add click handlers for buildings, set logo, and wire up custom cursor - wait for DOM to load
        document.addEventListener('DOMContentLoaded', function() {
            // Build the animated cursor element
            const cursor = document.createElement('div');
            cursor.className = 'custom-cursor';
            const cursorShape = document.createElement('div');
            cursorShape.className = 'custom-cursor-shape';
            const cursorText = document.createElement('div');
            cursorText.className = 'custom-cursor-text';
            cursorShape.appendChild(cursorText);
            cursor.appendChild(cursorShape);
            document.body.appendChild(cursor);

            // Map building IDs to project names
            const projectNames = {
                'anni-building': 'ANNI SUSHI',
                'lotta-building': 'LOTTA HASSELBLAD',
                'myart-building': 'MY ART',
                'club-building': 'CLUB CLASSICS'
            };

            // Track the cursor position with a small easing for smoothness
            let cursorX = -100, cursorY = -100;
            let targetX = -100, targetY = -100;

            function renderCursor() {
                // simple lerp to soften movement
                cursorX += (targetX - cursorX) * 0.35;
                cursorY += (targetY - cursorY) * 0.35;
                cursor.style.transform = `translate3d(${cursorX}px, ${cursorY}px, 0)`;
                requestAnimationFrame(renderCursor);
            }
            renderCursor();

            document.addEventListener('mousemove', (e) => {
                targetX = e.clientX;
                targetY = e.clientY;
            });

            // Add click animation - ensure shrink completes before allowing expansion
            let clickStartTime = 0;
            const clickAnimationDuration = 200; // Match CSS transition duration
            
            document.addEventListener('mousedown', () => {
                // If hovering, just remove hover state to return to default
                if (cursor.classList.contains('is-hovering')) {
                    cursor.classList.remove('is-hovering');
                    return;
                }
                
                // Otherwise, apply click shrink animation
                clickStartTime = Date.now();
                cursor.classList.add('is-clicking');
            });
            document.addEventListener('mouseup', () => {
                // Only handle click animation if we're actually clicking (not just removing hover)
                if (!cursor.classList.contains('is-clicking')) {
                    return;
                }
                
                const elapsed = Date.now() - clickStartTime;
                const remaining = Math.max(0, clickAnimationDuration - elapsed);
                
                // Wait for shrink animation to complete before expanding
                setTimeout(() => {
                    cursor.classList.remove('is-clicking');
                }, remaining);
            });

            // Toggle hover state on interactive elements (house images)
            const hoverTargets = document.querySelectorAll('.house');
            hoverTargets.forEach(el => {
                // Find the parent building container to get the project name
                const buildingContainer = el.closest('.building-container');
                const buildingId = buildingContainer ? buildingContainer.id : null;
                const projectName = buildingId ? projectNames[buildingId] : '';
                
                el.addEventListener('mouseenter', () => {
                    cursorText.textContent = projectName;
                    cursor.classList.add('is-hovering');
                });
                el.addEventListener('mouseleave', () => {
                    cursor.classList.remove('is-hovering');
                });
            });

            // Function to set logo based on screen size
            function setLogo() {
                const titleImg = document.querySelector('.title');
                if (titleImg) {
                    const isMobile = window.innerWidth <= 768 || /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
                    titleImg.src = isMobile ? 'resources/namelogo_mobile.svg' : 'resources/namelogo.svg';
                }
            }
            
            // Set logo initially
            setLogo();
            
            // Update logo on window resize
            window.addEventListener('resize', setLogo);
            
            // Function to update skyline width to match scrollable content
            function updateSkylineWidth() {
                const skyline = document.querySelector('.skyline');
                const sceneContainer = document.querySelector('.scene-container');
                if (skyline && sceneContainer) {
                    const scrollWidth = Math.max(document.body.scrollWidth, sceneContainer.offsetWidth);
                    skyline.style.width = Math.max(scrollWidth, window.innerWidth) + 'px';
                }
            }
            
            // Update skyline width initially and on resize
            updateSkylineWidth();
            window.addEventListener('resize', updateSkylineWidth);
            
            // Handle background video loading for Chrome compatibility
            const backgroundVideo = document.querySelector('.background-video');
            if (backgroundVideo) {
                // Check if video can play - Chrome doesn't support .mov files
                backgroundVideo.addEventListener('error', function() {
                    // If video fails to load, hide it so background shows through
                    backgroundVideo.style.display = 'none';
                }, true);
                
                // Also check after a short delay if video hasn't started playing
                setTimeout(function() {
                    if (backgroundVideo.readyState === 0 || backgroundVideo.readyState === 1) {
                        // Video hasn't loaded or can't play
                        backgroundVideo.style.display = 'none';
                    }
                }, 2000);
            }
        });
    </script>
</head>
<body class="loading">
    <div class="loading-indicator">
        <div class="loading-spinner"></div>
        <div class="loading-text">LOADING</div>
    </div>
    <video class="background-video" autoplay loop muted playsinline webkit-playsinline preload="auto">
        <source src="resources/clouds.mp4" type="video/mp4">
    </video>
    <img src="resources/skyline.png" class="skyline" alt="Skyline">
    <img src="" class="title" alt="Title">
    <div class="background"></div>
    <div class="scene-container">
        <div id="anni-building" class="building-container">
            <img src="resources/house 3.png" class="house" alt="Anni House">
            <div id="house-line-anni" class="house-line"></div>
            <div id="house-blocker-anni" class="house-click-blocker"></div>
            <img src="resources/click.gif" class="click" alt="Click">
            <img src="resources/birds.gif" class="birds" alt="Birds">
            <img src="resources/butterfly.gif" class="butterfly" alt="Butterfly">
        </div>
        
        <div id="lotta-building" class="building-container">
            <img src="resources/house 1.png" class="house" alt="Lotta House">
            <div id="house-line-lotta" class="house-line"></div>
            <div id="house-blocker-lotta" class="house-click-blocker"></div>
            <img src="resources/palmtree.gif" class="palmtree" alt="Palm tree">
        </div>
        
        <div id="club-building" class="building-container">
            <img src="resources/house 4.png" class="house" alt="Club House">
            <div id="house-line-club" class="house-line"></div>
            <div id="house-blocker-club" class="house-click-blocker"></div>
        </div>
        
        <div id="myart-building" class="building-container">
            <img src="resources/house 2.png" class="house" alt="My Art House">
            <div id="house-line-myart" class="house-line"></div>

        </div>
        
        <img src="resources/car.png" class="car" id="car" alt="Car">
        <div class="ground loading"></div>
    </div>
</body>
